<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Penjualan Bibit Pepaya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Login Aplikasi Bibit</h2>
    
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Contoh: admin@bibit.com atau budi@gmail.com">
    </div>

    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" placeholder="Password...">
    </div>

    <div class="form-group">
        <button onclick="prosesLogin()">Masuk / Login</button>
    </div>

    <p id="status-login" style="text-align: center; font-weight: bold; margin-top: 15px;"></p>
</div>

<script>
    function prosesLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const status = document.getElementById('status-login');

        if (!email || !password) {
            alert("Email dan password wajib diisi!");
            return;
        }

        status.style.color = "#2980b9";
        status.textContent = "Menghubungkan ke server...";

        fetch('http://localhost:8080/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                status.style.color = "#27ae60";
                status.textContent = "Login berhasil! Mengalihkan...";
                
                // Simpan data user ke localStorage browser
                localStorage.setItem('id_user', data.id_user);
                localStorage.setItem('nama', data.nama);
                localStorage.setItem('role', data.role);

                // Beri jeda sebentar agar localStorage tersimpan sempurna sebelum pindah halaman
                setTimeout(() => {
                    if (data.role === 'admin') {
                        window.location.href = 'admin.html'; // Masuk ke dashboard admin
                    } else {
                        window.location.href = 'index.html'; // Masuk ke halaman katalog customer
                    }
                }, 600);
            } else {
                status.style.color = "#c0392b";
                status.textContent = data.message;
            }
        })
        .catch(err => {
            console.error(err);
            status.style.color = "#c0392b";
            status.textContent = "Gagal terhubung ke server Java!";
        });
    }
</script>

</body>
</html>
