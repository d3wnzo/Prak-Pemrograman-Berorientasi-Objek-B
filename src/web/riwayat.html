<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pesanan - Customer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cust-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <a href="index.html" class="btn-link" style="text-decoration: none; padding: 10px 15px; background: #10b981; color: white; border-radius: 8px; font-weight: 600;">← Buat Pesanan Baru</a>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <h2>Status Pesanan Saya</h2>
    <p id="welcome-cust" style="font-weight: 600; color: #047857; margin-bottom: 20px; text-align: center;"></p>

    <table>
        <thead>
            <tr>
                <th>ID Pesanan</th>
                <th>Total Harga</th>
                <th>Status</th>
                <th>Tanggal Pesanan</th>
            </tr>
        </thead>
        <tbody id="tabel-riwayat">
            <tr><td colspan="4" style="text-align: center;">Memuat status pesanan...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const idUser = localStorage.getItem('id_user');
    const namaUser = localStorage.getItem('nama');
    const role = localStorage.getItem('role');

    if (!idUser || role !== 'customer') {
        alert("Silakan login sebagai customer terlebih dahulu!");
        window.location.href = 'login.html';
    } else {
        document.getElementById('welcome-cust').textContent = "Halo, " + namaUser;
    }

    fetch('http://localhost:8080/api/customer/pesanan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_user: parseInt(idUser) })
    })
    .then(res => res.json())
    .then(data => {
        const tbody = document.getElementById('tabel-riwayat');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Belum ada pesanan untuk akun ini.</td></tr>';
            return;
        }

        data.forEach(p => {
            let warnaStatus = "#d97706";
            if (p.status_pesanan === 'Diproses') warnaStatus = "#059669";
            if (p.status_pesanan === 'Ditolak') warnaStatus = "#dc2626";

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${p.id_pesanan}</td>
                <td>Rp ${Number(p.total_harga).toLocaleString()}</td>
                <td><strong style="color: ${warnaStatus};">${p.status_pesanan}</strong></td>
                <td>${p.tanggal_pesanan}</td>
            `;
            tbody.appendChild(tr);
        });
    })
    .catch(err => {
        console.error("Gagal fetch riwayat:", err);
        document.getElementById('tabel-riwayat').innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Gagal terhubung ke server!</td></tr>';
    });

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
